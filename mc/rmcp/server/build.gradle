plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}

group = "calebxzhou.rdi.mc.rmcp"
version = "0.1"

ext.kotlinxSerializationVersion = "1.9.0"
ext.kotlinRuntimeVersion = "2.3.0"

repositories {
    mavenLocal()
    mavenCentral()
}

/*java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

kotlin {
    jvmToolchain(25)
}*/

dependencies {
    api project(':rmcp-common')
    compileOnly("org.jetbrains.kotlin:kotlin-stdlib:2.4.21")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
