# Cross-builds the slim FFmpeg natives on Linux, then tests each jar on its real platform.
# The repository is public, so nothing here may use real accounts or print node addresses.
name: ffmpeg-natives

on:
  workflow_dispatch:
  push:
    paths:
      - client/mediaproc/ffmpeg/**
      - .github/workflows/ffmpeg-natives.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, linux-x64, macos-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install the build tools
        run: sudo apt-get update && sudo apt-get install -y nasm meson ninja-build pkgconf llvm
      - name: Build
        run: bash client/mediaproc/ffmpeg/build-natives.sh ${{ matrix.platform }} "$RUNNER_TEMP/ffmpeg-work" natives
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-natives-${{ matrix.platform }}
          path: natives/*.jar
          retention-days: 14
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            gradle: .\gradlew.bat
          # gradlew is not executable in git.
          - os: ubuntu-24.04
            platform: linux-x64
            gradle: bash ./gradlew
          # The oldest glibc the natives claim to support.
          - os: ubuntu-22.04
            platform: linux-x64
            gradle: bash ./gradlew
          - os: macos-15
            platform: macos-arm64
            gradle: bash ./gradlew
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-natives-${{ matrix.platform }}
          path: natives
      - name: Find the jar
        shell: pwsh
        run: |
          $jar = @(Get-ChildItem natives -Filter '*.jar')
          if ($jar.Count -ne 1) { Write-Output "::error::Expected one natives jar"; exit 1 }
          Write-Output "Natives jar: $($jar[0].Name), $([math]::Round($jar[0].Length / 1MB, 2))MiB"
          "NATIVES_JAR=$($jar[0].FullName)" | Out-File -Append $env:GITHUB_ENV
      - name: Check the macOS libraries
        if: ${{ runner.os == 'macOS' }}
        run: |
          mkdir natives/unpacked
          unzip -q natives/*.jar -d natives/unpacked
          for library in natives/unpacked/org/bytedeco/ffmpeg/*/*.dylib; do
            otool -L "$library"
            codesign -dv "$library"
          done
      - name: Run the tests
        working-directory: client/ui
        shell: pwsh
        # Quoted because PowerShell splits an unquoted argument at the dot in the property name.
        run: ${{ matrix.gradle }} :mediaproc:test :mediaproc:nativePreloadTest --continue "-Prdi.targetPlatform=${{ matrix.platform }}" "-Prdi.ffmpegNativesJar=$env:NATIVES_JAR"
      - name: Check that every test really ran
        if: ${{ !cancelled() }}
        shell: pwsh
        run: client/mediaproc/check-test-results.ps1
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: ffmpeg-natives-test-reports-${{ matrix.os }}
          path: |
            client/mediaproc/build/reports/tests
            client/mediaproc/build/test-results
          retention-days: 7
          if-no-files-found: ignore
