plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.10'

}

tasks.named('wrapper', Wrapper) {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    //CurseForge
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    //Modrinth
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
}

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.test

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    validateAccessTransformers = true

    runs {
        register('server') {
            server()
            //要兼顾ws和http 所以这里没有开头的ws
            systemProperty("rdi.ihq.url", "127.0.0.1:65231")
            systemProperty("rdi.host.id", "6970b4b685846053425d0529")
            jvmArgument '-Xmx4G'
            programArgument '--nogui'
            systemProperty 'rdi.debug', 'true'
            systemProperty 'rdi.onlySaveFirmSections', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'rdi'
        }

        register('gameTestServer') {
            type = 'gameTestServer'
            jvmArgument '-Xmx4G'
            systemProperty 'neoforge.gameTestServer', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'minecraft'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        register(mod_id) {
            def sourceSets = project.extensions.getByType(SourceSetContainer)
            sourceSet sourceSets.named('main').get()
        }
    }
}

sourceSets.named('main') {
    java.srcDir '../../../mc/common/2021/src/main/java'
    kotlin.srcDir '../../../mc/common/2021/src/main/kotlin'
    kotlin.srcDir '../../../mc/common/codec/src/main/kotlin'
    kotlin.srcDir '../../../mc/common/all/src/main/kotlin'
    kotlin.srcDir '../../../mc/firmsection/src/main/kotlin'
    kotlin.srcDir '../../../mc/rcmd/src/main/kotlin'
    kotlin.srcDir '../../../mc/rmcp/server/src/main/kotlin'
    resources.srcDir 'src/generated/resources'
}

sourceSets.named('test') {
    kotlin.srcDir '../../../mc/common/codec/src/test/kotlin'
}

def localRuntimeConfiguration = configurations.maybeCreate('localRuntime')
def librariesConfiguration = configurations.maybeCreate('libraries')
def shadedConfiguration = configurations.maybeCreate('shaded')
configurations.named('runtimeClasspath') {
    extendsFrom localRuntimeConfiguration
}
configurations.named('implementation') {
    extendsFrom librariesConfiguration
}

dependencies {
    implementation project(':s-mc-common')
    additionalRuntimeClasspath project(':s-mc-common')
    implementation project(':rmcp-common')
    additionalRuntimeClasspath project(':rmcp-common')
    shaded 'com.neovisionaries:nv-websocket-client:2.14'
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0")
    implementation("org.jetbrains.kotlin:kotlin-stdlib:2.4.10")
    additionalRuntimeClasspath("org.jetbrains.kotlin:kotlin-stdlib:2.4.10")
    implementation("com.github.luben:zstd-jni:1.5.7-11:win_amd64")
    additionalRuntimeClasspath("com.github.luben:zstd-jni:1.5.7-11:win_amd64")
    jarJar("com.github.luben:zstd-jni:1.5.7-11:linux_amd64")
    //>>>Modrinth Mods<<<
    [
            'architectury-api:13.0.8+neoforge',
            'create:6.0.10+mc1.21.1',
      //      'world-pre-generator:1.21.1-5.0.1',
            /*'jade:11.13.1+forge',
            'embeddium:0.3.31+mc1.20.1',
            "architectury-api:9.2.14+forge",
            "gregtechceu-modern:mc1.20.1-1.6.4"*/
    ].each { dep ->
        implementation "maven.modrinth:$dep"
    }
    //>>>CurseForge Mods<<<
    [
        "ftb-library-forge-404465:7746959",
        "ftb-quests-forge-289412:7878289",
        "ftb-teams-forge-404468:7878281",
    ].each { dep ->
        implementation "curse.maven:$dep-deobf"
    }

    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'io.netty:netty-buffer:4.1.97.Final'
    testImplementation 'io.netty:netty-codec:4.1.97.Final'
    testImplementation 'io.netty:netty-common:4.1.97.Final'
    testImplementation 'io.netty:netty-transport:4.1.97.Final'
    testRuntimeOnly 'io.github.llamalad7:mixinextras-common:0.5.3'


}

def metadataOutput = layout.buildDirectory.dir('generated/sources/modMetadata')

tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties(replaceProperties)
    expand(replaceProperties)
    from 'src/main/templates'
    into metadataOutput
}

sourceSets.named('main') {
    resources.srcDir metadataOutput
}

neoForge.ideSyncTask(tasks.named('generateModMetadata'))

def localRepoDir = project.layout.projectDirectory.dir('repo')

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = localRepoDir.asFile.toURI()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
evaluationDependsOn(':s-mc-common')
evaluationDependsOn(':rmcp-common')
jar {
    // Bundle compiled outputs from shared server modules into this jar
    dependsOn project(":s-mc-common").tasks.named("classes")
    dependsOn project(":rmcp-common").tasks.named("classes")
    from(project(":s-mc-common").sourceSets.main.output)
    from(project(":rmcp-common").sourceSets.main.output)
    from({
        shadedConfiguration.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
project(':s-mc-common').ext.registerServerCopyTask(project)
