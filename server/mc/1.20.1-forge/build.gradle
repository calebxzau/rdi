import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.10'
}

base {
    archivesName = "rdi"
}

version = "5-mc-server-1.20.1-forge"
group = "calebxzhou.rdi"
sourceSets.main {
    ext["refMap"] = "rdi.mixins.refmap.json"
    // java.srcDir '../../../mc/chunkcache/1.20.1/src/main/java'
    java.srcDir '../../../mc/20/src/server/java'
    java.srcDir '../../../mc/common/2021/src/main/java'
    kotlin.srcDir '../../../mc/20/src/server/kotlin'
    kotlin.srcDir '../../../mc/common/2021/src/main/kotlin'
    kotlin.srcDir '../../../mc/common/codec/src/main/kotlin'
    kotlin.srcDir '../../../mc/syncchunk/src/main/kotlin'
    kotlin.srcDir '../../../mc/rcmd/src/main/kotlin'
    kotlin.srcDir '../../../mc/rmcp/server/src/main/kotlin'
    java.exclude(
            'calebxzhou/rdi/mc/server/mixin/mChatMsg.java',
            'calebxzhou/rdi/mc/server/mixin/mFullBrightLightPacket.java',
            'calebxzhou/rdi/mc/server/mixin/mGuardTick.java',
            'calebxzhou/rdi/mc/server/mixin/mLimitEntitiesInSection.java',
            'calebxzhou/rdi/mc/server/mixin/mLimitExecutor.java',
            'calebxzhou/rdi/mc/server/mixin/mRcmdCommandInput.java'
    )
}
sourceSets.create('zstdTest') {
    kotlin.srcDir '../../../mc/common/codec/src/main/kotlin'
    kotlin.srcDir '../../../mc/common/codec/src/test/kotlin'
}
mixin {
    add sourceSets.main, 'rdi.mixins.refmap.json'
    config "rdi.mixins.json"
    config "rdi.v20.server.mixins.json"
}

repositories {
    mavenLocal()
    mavenCentral()
    //CurseForge
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    //Modrinth
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = "Forge Maven"
        url = "https://maven.minecraftforge.net/"
    }
    maven {
        name = "Architectury Maven"
        url = "https://maven.architectury.dev/"
    }
    maven {
        name = "FTB Maven"
        url = "https://maven.ftb.dev/releases"
    }

}
legacyForge {
    version = "1.20.1-47.4.20"
    validateAccessTransformers = true
    runs {
        server {
            server()
            systemProperty("rdi.ihq.url", "127.0.0.1:65231")
            systemProperty("rdi.debug", "true")
            systemProperty("rdi.host.id", "695f9e5ad05510e77c09ea1a")
            systemProperty("mixin.hotSwap", "true")
            programArguments = [
                "--nogui",
                "-mixin.config=rdi.mixins.json",
                "-mixin.config=rdi.v20.server.mixins.json",
            ]
        }

        register('gameTestServer') {
            type = 'gameTestServer'
            jvmArgument '-Xmx4G'
            systemProperty 'forge.gameTestServer', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'minecraft'
            systemProperty 'rdi.maxEntitiesPerSection', '8'
            systemProperty("rdi.ihq.url", "127.0.0.1:65231")
            systemProperty("rdi.debug", "true")
            systemProperty("rdi.host.id", "695f9e5ad05510e77c09ea1a")
        }
    }
    mods {
        rdi {

            sourceSet sourceSets.main

        }
    }
    parchment {
        // Get versions from https://parchmentmc.org/docs/getting-started
        // Omit the "v"-prefix in mappingsVersion
        minecraftVersion = "1.20.1"
        mappingsVersion = "2023.09.03"
    }
}

def shadedConfiguration = configurations.maybeCreate('shaded')

dependencies {
    implementation("org.jetbrains.kotlin:kotlin-stdlib:2.4.10")
    additionalRuntimeClasspath("org.jetbrains.kotlin:kotlin-stdlib:2.4.10")
    implementation("com.github.luben:zstd-jni:1.5.7-11:win_amd64")
    additionalRuntimeClasspath("com.github.luben:zstd-jni:1.5.7-11:win_amd64")
    jarJar("com.github.luben:zstd-jni:1.5.7-11:linux_amd64")
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.3"))
    implementation project(':s-mc-common')
    additionalRuntimeClasspath project(':s-mc-common')
    implementation project(':rmcp-common')
    additionalRuntimeClasspath project(':rmcp-common')
    shaded 'com.neovisionaries:nv-websocket-client:2.14'
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0")
    //>>>Modrinth Mods<<<
    [
    ].each { dep ->
        implementation "maven.modrinth:$dep"
    }
    //>>>Official FTB Mods<<<
    [
            "dev.architectury:architectury-forge:9.1.12",
            "dev.ftb.mods:ftb-library-forge:2001.2.9",
            "dev.ftb.mods:ftb-teams-forge:2001.3.1",
            "dev.ftb.mods:ftb-quests-forge:2001.4.22",
    ].each { dep ->
        modImplementation dep
    }
    zstdTestImplementation 'org.jetbrains.kotlin:kotlin-test-junit5:2.4.10'
    zstdTestImplementation 'com.github.luben:zstd-jni:1.5.7-11:win_amd64'
    zstdTestImplementation 'io.netty:netty-buffer:4.1.97.Final'
    zstdTestImplementation 'io.netty:netty-codec:4.1.97.Final'
    zstdTestImplementation 'io.netty:netty-common:4.1.97.Final'
    zstdTestImplementation 'io.netty:netty-transport:4.1.97.Final'
    zstdTestRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.1'
}

tasks.register('zstdTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.zstdTest.output.classesDirs
    classpath = sourceSets.zstdTest.runtimeClasspath
    useJUnitPlatform()
}


// Ensure the common project is evaluated before we look up its tasks/outputs
evaluationDependsOn(':s-mc-common')
evaluationDependsOn(':rmcp-common')

processResources {
    var properties = [
            "mod_license"      : "gplv3",
            "mod_id"           : mod_id,
            "version"          : version,
            "mod_name"         : mod_name,
            "mod_author"       : mod_authors,
            "forge_version"    : forge_version,
            "minecraft_version": minecraft_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
   /* javaCompiler.set(javaToolchains.compilerFor {
        languageVersion.set(JavaLanguageVersion.of(21))
    })
    options.release.set(21)*/

    options.compilerArgs << "-Xlint:-deprecation"
    options.compilerArgs << "-Xlint:-removal"
}

java {
    withSourcesJar()
}

jar {
    // Bundle compiled outputs from shared server modules into this jar
    dependsOn project(":s-mc-common").tasks.named("classes")
    dependsOn project(":rmcp-common").tasks.named("classes")
    from(project(":s-mc-common").sourceSets.main.output)
    from(project(":rmcp-common").sourceSets.main.output)
    from({
        shadedConfiguration.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "rdi.mixins.json,rdi.v20.server.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(GroovyCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(ScalaCompile) {
    scalaCompileOptions.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
project(':s-mc-common').ext.registerServerCopyTask(project)
