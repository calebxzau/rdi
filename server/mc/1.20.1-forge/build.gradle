def shadedConfiguration = configurations.maybeCreate('shaded')

// Keep the SQLite driver and its Linux natives in one JarJar artifact so dependency
// identity selection cannot drop the native library from the release jar.
def sqliteLinuxRuntimeConfiguration = configurations.create('sqliteLinuxRuntime') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

def sqliteLinuxRuntimeJar = tasks.register('sqliteLinuxRuntimeJar', Jar) {
    dependsOn(sqliteLinuxRuntimeConfiguration)
    from {
        sqliteLinuxRuntimeConfiguration.collect { dependency -> zipTree(dependency) }
    }
    exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Automatic-Module-Name': 'org.xerial.sqlitejdbc',
                'Multi-Release'        : 'true',
        )
    }
    archiveFileName = 'sqlite-jdbc-3.53.4.0-linux-runtime.jar'
    destinationDirectory = layout.buildDirectory.dir('generated/sqlite-runtime')
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}

dependencies {
    implementation("org.jetbrains.kotlin:kotlin-stdlib:2.4.10")
    additionalRuntimeClasspath("org.jetbrains.kotlin:kotlin-stdlib:2.4.10")
    implementation("com.github.luben:zstd-jni:1.5.7-11:win_amd64")
    additionalRuntimeClasspath("com.github.luben:zstd-jni:1.5.7-11:win_amd64")
    jarJar("com.github.luben:zstd-jni:1.5.7-11:linux_amd64")
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.3"))
    // Development runs and tests load the Windows natives; the release jar carries Linux only.
    implementation("org.xerial:sqlite-jdbc:3.53.4.0")
    additionalRuntimeClasspath("org.xerial:sqlite-jdbc:3.53.4.0")
    additionalRuntimeClasspath("org.xerial:sqlite-jdbc:3.53.4.0:natives-windows")
    sqliteLinuxRuntime("org.xerial:sqlite-jdbc:3.53.4.0:without-natives")
    sqliteLinuxRuntime("org.xerial:sqlite-jdbc:3.53.4.0:natives-linux")
    jarJar(files(sqliteLinuxRuntimeJar.flatMap { it.archiveFile }).builtBy(sqliteLinuxRuntimeJar))

    implementation project(':s-mc-common')
    additionalRuntimeClasspath project(':s-mc-common')
    implementation project(':rmcp-common')
    additionalRuntimeClasspath project(':rmcp-common')
    shaded 'com.neovisionaries:nv-websocket-client:2.14'
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0")
    //>>>Modrinth Mods<<<
    [
    ].each { dep ->
        implementation "maven.modrinth:$dep"
    }
    //>>>Official FTB Mods<<<
    [
            "dev.architectury:architectury-forge:9.1.12",
            "dev.ftb.mods:ftb-library-forge:2001.2.9",
            "dev.ftb.mods:ftb-teams-forge:2001.3.1",
            "dev.ftb.mods:ftb-quests-forge:2001.4.22",
    ].each { dep ->
        modImplementation dep
    }
    zstdTestImplementation 'org.jetbrains.kotlin:kotlin-test-junit5:2.4.10'
    zstdTestImplementation 'com.github.luben:zstd-jni:1.5.7-11:win_amd64'
    zstdTestImplementation 'io.netty:netty-buffer:4.1.97.Final'
    zstdTestImplementation 'io.netty:netty-codec:4.1.97.Final'
    zstdTestImplementation 'io.netty:netty-common:4.1.97.Final'
    zstdTestImplementation 'io.netty:netty-transport:4.1.97.Final'
    zstdTestRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.1'

    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5:2.4.10'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.1'
    testImplementation 'io.github.llamalad7:mixinextras-common:0.5.3'
}

