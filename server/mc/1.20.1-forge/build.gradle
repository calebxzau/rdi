jar {
    // Bundle compiled outputs from shared server modules into this jar
    dependsOn project(":s-mc-common").tasks.named("classes")
    dependsOn project(":rmcp-common").tasks.named("classes")
    from(project(":s-mc-common").sourceSets.main.output)
    from(project(":rmcp-common").sourceSets.main.output)
    from({
        shadedConfiguration.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "rdi.mixins.json,rdi.v20.server.mixins.json,rdi.l2.server.mixins.json,rdi.chunkcache.server.mixins.json"
        ])
    }
}

