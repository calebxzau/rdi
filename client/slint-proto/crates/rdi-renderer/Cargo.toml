[package]
name = "rdi-renderer"
version = "0.1.0"
edition = "2024"

[features]
allocation-probe = []

[dependencies]
wgpu = "=30.0.1"
glam = "=0.34.1"
half = "=2.7.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
anyhow = "1.0.104"
tracing = "0.1.44"

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
