[package]
name = "rdi-slint-proto"
version = "0.1.0"
edition = "2024"

[features]
allocation-probe = []

[dependencies]
glam = "=0.34.1"
half = "=2.7.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=0.4.0"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg-wgpu", "renderer-software", "unstable-wgpu-30", "unstable-winit-030"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
lru = "0.19.0"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
