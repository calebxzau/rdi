[workspace]
members = ["crates/rdi-renderer"]
resolver = "3"

[package]
name = "rdi-slint-proto"
version = "0.1.0"
edition = "2024"

[features]
allocation-probe = ["rdi-renderer/allocation-probe"]

[dependencies]
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
sha1 = "=0.10.7"
# J5a: offline player UUIDs are MD5 name UUIDs, as Java UUID.nameUUIDFromBytes.
md-5 = "=0.10.6"
# J5a: Mojang rules match os.version with a regular expression; already in the lock file.
regex = "=1.13.1"
sha2 = "=0.10.9"
encoding_rs = "=0.8.41"
uuid = { version = "=1.29.0", features = ["v7"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
# J4c: client pack archives are tar.zst; the zstd C library builds through zigbuild.
tar = { version = "=0.4.46", default-features = false }
zstd = { version = "=0.13.3", default-features = false }
# J5 spike: AVIF pack icons in pure Rust, no `asm` features, so no NASM or C compiler.
# AGPL-3.0 (GPLv3 §13 allows combining); plain rav1d 1.1.0 aborts on corrupt data.
rav1d-safe = { version = "=0.6.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
avif-parse = "=2.1.0"

rdi-renderer = { path = "crates/rdi-renderer" }
# J5b: the room connection runs inside the launcher (J5 decision D3), no native library to load.
rdi-local-proxy = { path = "../local-proxy-rs" }
rdi-session-resume = { path = "../../common/session-resume-rs" }
# A3: save import (导入存档): strict save reading and player UUID remapping.
rdi-anvilrw = { path = "../../common/anvilrw-rs" }
glam = "=0.34.1"
half = "=2.7.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=0.4.0"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg-wgpu", "renderer-software", "unstable-wgpu-30", "unstable-winit-030"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "form", "gzip", "deflate", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
lru = "0.19.0"
rfd = "=0.17.2"
webbrowser = "=1.2.5"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Launcher MCP: a small local HTTP server; these versions were already locked through reqwest.
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
# Launcher MCP token: 32 bytes from the OS random source; already in the lock file.
getrandom = "=0.3.4"

# U4b1: QQ mail operation codes, the same AES-256-GCM as Kotlin CryptoManager.
aes-gcm = "=0.10.3"
# U4b2: 清除无效整合包 moves folders to the system recycle bin, as Compose moveToOsTrash.
trash = "=5.4.0"

# Image disk cache: RFC 9111 freshness and revalidation rules (IMAGE-CACHE-PLAN.md D5).
http-cache-semantics = { version = "=3.0.0", default-features = false, features = ["serde", "reqwest"] }
toml = "=0.9.12"
sysinfo = "=0.40.1"
# Compiles SQLite from source, so data.db needs no system library (J2 D2).
rusqlite = { version = "=0.41.1", features = ["bundled"] }

# Load fontconfig at run time, so cross-compiling for Linux needs no pkg-config or sysroot.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "=0.11.1", features = ["fontconfig-dlopen"] }

[target.'cfg(windows)'.dependencies]
wmi = "=0.18.4"
windows = { version = "=0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }


[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }

[build-dependencies]
slint-build = "=1.18.1"

# Everyday builds and tests: line numbers for our own code, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Breakpoint debugging of our own code: cargo run/test --profile debugging (target/debugging).
# Dependencies keep no debug info, so slint/wgpu cannot be stepped into.
[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
