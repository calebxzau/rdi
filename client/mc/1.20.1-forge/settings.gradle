pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    versionCatalogs {
        libs {
            from(files('../../ui/gradle/libs.versions.toml'))
        }
    }
}
rootProject.name = "c20"
include(":c-mc-common")
project(":c-mc-common").projectDir = file("../common")
include(":rmcp-common")
project(":rmcp-common").projectDir = file("../../../mc/rmcp/common")
include(":rmcp-client")
project(":rmcp-client").projectDir = file("../../../mc/rmcp/client")
include(":mediaproc")
project(":mediaproc").projectDir = file("../../mediaproc")
include(":early-display")
project(":early-display").projectDir = file("../../early-display")
