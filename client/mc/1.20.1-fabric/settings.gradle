pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    versionCatalogs {
        libs {
            from(files('../../ui/gradle/libs.versions.toml'))
        }
    }
}

rootProject.name = 'c20a'

include(':c-mc-common', ':mediaproc')
project(':c-mc-common').projectDir = file('../common')
project(':mediaproc').projectDir = file('../../mediaproc')
