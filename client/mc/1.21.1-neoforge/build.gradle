    evaluationDependsOn(':rmcp-common')
    evaluationDependsOn(':rmcp-client')
    evaluationDependsOn(':mediaproc')
    evaluationDependsOn(':firmsection')
    // Bundle compiled classes from :c-mc-common into this jar.
    // Common resources are already added via sourceSets.main.resources above.
    dependsOn project(":c-mc-common").tasks.named("classes")
    dependsOn project(":rmcp-common").tasks.named("classes")
    dependsOn project(":rmcp-client").tasks.named("classes")
    dependsOn project(":firmsection").tasks.named("classes")

