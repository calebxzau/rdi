def earlyDisplayNativeJarFile = earlyDisplayNativeConfiguration.singleFile
def extractEarlyDisplayFfmpeg = tasks.register('extractEarlyDisplayFfmpeg', Sync) {
    from(zipTree(earlyDisplayNativeJarFile)) {
        include 'org/bytedeco/ffmpeg/windows-x86_64-gpl/*.dll'
        include 'org/bytedeco/ffmpeg/windows-x86_64-gpl/ffmpeg.exe'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('early-display/ffmpeg')
}

def earlyDisplayConfigFile = file('run/config/fml.toml')
def earlyDisplayModsDir = file('run/mods')
def earlyDisplayProviderJarFile = project(':early-display').tasks.named('jar').get().archiveFile.get().asFile

def configureEarlyDisplayProvider = {
    def configFile = earlyDisplayConfigFile
    if (!configFile.isFile()) return

    def config = configFile.getText('UTF-8')
    def controlMatcher = config =~ /(?m)^\s*earlyWindowControl\s*=\s*(true|false)\s*$/
    if (controlMatcher.find() && controlMatcher.group(1) == 'false') return

    def providerMatcher = config =~ /(?m)^\s*earlyWindowProvider\s*=\s*"([^"]+)"\s*$/
    def currentProvider = providerMatcher.find() ? providerMatcher.group(1) : null
    if (currentProvider != null && currentProvider != 'fmlearlywindow' && currentProvider != 'rdiearlywindow') return

    def providerJar = earlyDisplayProviderJarFile
    def modsDir = earlyDisplayModsDir
    def targetJar = new File(modsDir, 'rdi-early-display.jar')
    def linked = false
    try {
        modsDir.mkdirs()
        if (targetJar.exists() && !Files.isSymbolicLink(targetJar.toPath()) && Files.isSameFile(targetJar.toPath(), providerJar.toPath())) {
            linked = true
        } else {
            Files.deleteIfExists(targetJar.toPath())
            Files.createLink(targetJar.toPath(), providerJar.toPath())
            linked = true
        }
    } catch (Exception exception) {
    }

    def selectedProvider = linked ? 'rdiearlywindow' : 'fmlearlywindow'
    if (currentProvider == null) {
        config += System.lineSeparator() + "earlyWindowProvider = \"${selectedProvider}\"" + System.lineSeparator()
    } else if (currentProvider != selectedProvider) {
        config = config.replaceFirst(
                /(?m)^(\s*earlyWindowProvider\s*=\s*)"[^"]+"\s*$/,
                "\$1\"${selectedProvider}\"")
    }
    configFile.setText(config, 'UTF-8')
}

tasks.matching { it.name == 'runClient' || it.name == 'runClient2' }.configureEach {
