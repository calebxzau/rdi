def mediaProcNativeJarFile = mediaProcNativeConfiguration.singleFile
def extractMediaProcNatives = tasks.register('extractMediaProcNatives', Sync) {
    from(zipTree(mediaProcNativeJarFile)) {
        include 'org/bytedeco/ffmpeg/windows-x86_64-gpl/*.dll'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('mediaproc-natives/ffmpeg')
}

// An early loading window opens before mixins can run, so a background dev client starts without one.
def configureDevEarlyWindow = { File runDir ->
    def configFile = new File(runDir, 'config/fml.toml')
    if (!configFile.isFile()) return

    def background = (System.getenv('JDK_JAVA_OPTIONS') ?: '').contains('-Drdi.dev.window=background')
    def config = configFile.getText('UTF-8')
    def updated = config.replaceFirst(/(?m)^(\s*earlyWindowControl\s*=\s*)(true|false)/, "\$1${!background}")
    if (updated != config) configFile.setText(updated, 'UTF-8')
}

[runClient: 'run', runClient2: 'run2', runClient3: 'run3'].each { taskName, runDirName ->
    def runDir = file(runDirName)
    tasks.matching { it.name == taskName }.configureEach {
        dependsOn extractMediaProcNatives
        doFirst { configureDevEarlyWindow(runDir) }
    }
}

