[package]
name = "rdi-anvilrw"
version = "0.1.0"
edition = "2024"
description = "Strict save reading and player UUID remapping for importing Minecraft saves into RDI hosts (Rust port of common/anvilrw remap)"

# Versions match client/slint-proto so the launcher builds one copy of each.
[dependencies]
flate2 = "=1.1.10"
crc32fast = "=1.5.3"
zstd = { version = "=0.13.3", default-features = false }
regex = "=1.13.1"
uuid = "=1.29.0"
md-5 = "=0.10.6"
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
